<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taven | Track Order</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-nav"></div>
  <main>
    <div class="page-banner"><div class="container"><h1 class="h2 mb-1">Track Your Order</h1><p>Enter the reference number from your receipt.</p></div></div>
    <section class="container py-5" style="max-width:680px">
      <form id="track-form" class="d-flex gap-2 mb-4">
        <input type="text" id="track-ref" class="form-control form-control-lg" placeholder="e.g. TV-123456" aria-label="Order reference number" required>
        <button class="btn btn-brand px-4">Track</button>
      </form>
      <div id="track-result"></div>
    </section>
  </main>
  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
