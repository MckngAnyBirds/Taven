<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taven | Thank You</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-nav"></div>
  <main>
    <section class="container py-5" style="max-width:680px">
      <div class="text-center mb-4">
        <div class="feature-icon">✅</div>
        <h1 class="h3" id="thankyou-message" style="color:var(--brand)">Thank you! Your order has been placed.</h1>
        <p class="text-muted">Keep your reference number. Staff will confirm and prepare your order.</p>
      </div>
      <div class="soft-card receipt-card p-4">
        <h2 class="h5 mb-3">Your receipt</h2>
        <div id="receipt"></div>
      </div>
      <div class="d-flex justify-content-center gap-2 mt-4 no-print">
        <a href="track.html" id="track-link" class="btn btn-brand px-4">Track this order</a>
        <a href="order.html" class="btn btn-outline-brand px-4">Order again</a>
        <button class="btn btn-outline-brand px-4" onclick="window.print()">Print receipt</button>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
