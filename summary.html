<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taven | Summary</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-nav"></div>
  <main>
    <div class="page-banner"><div class="container"><h1 class="h2 mb-2">Your Order Summary</h1><div class="flow-steps"><span>Browse</span><span>Details</span><span>Cart</span><span class="on">Checkout</span><span>Payment</span><span>Confirmation</span><span>Status</span></div></div></div>
    <section class="container py-5">
      <div id="cart-empty" class="soft-card text-center p-5 d-none">
        <div class="feature-icon">🛒</div>
        <h2 class="h4">Your cart is empty</h2>
        <p class="text-muted">Add a few dishes from the menu to get started.</p>
        <a href="order.html" class="btn btn-brand px-4">Browse the menu</a>
      </div>

      <div id="cart-panel" class="row g-4">
        <div class="col-lg-7">
          <div id="cart-items"></div>
          <div class="d-flex gap-2">
            <a href="order.html" class="btn btn-outline-brand px-4">Back to menu</a>
            <button type="button" id="clear-cart" class="btn btn-outline-danger rounded-pill px-4">Clear cart</button>
          </div>
        </div>
        <div class="col-lg-5">
          <form id="checkout-form" class="soft-card p-4 sticky-card" novalidate>
            <h2 class="h5 mb-3">Checkout</h2>
            <div class="mb-3">
              <label for="customer-name" class="form-label">Name</label>
              <input type="text" id="customer-name" class="form-control" placeholder="Enter your name" required>
            </div>
            <div class="mb-3">
              <label for="order-type" class="form-label">Order type</label>
              <select id="order-type" class="form-select"><option>Pickup</option><option>Delivery</option></select>
            </div>
            <div class="mb-3">
              <label for="customer-phone" class="form-label">Contact number</label>
              <input type="tel" id="customer-phone" class="form-control" placeholder="09XX XXX XXXX">
            </div>
            <div class="mb-3 d-none" id="addr-box">
              <label for="customer-address" class="form-label">Delivery address <span class="small">(recorded only; no delivery tracking)</span></label>
              <textarea id="customer-address" class="form-control" rows="2"></textarea>
            </div>
            <div class="mb-3">
              <label for="discount-type" class="form-label">Discount</label>
              <select id="discount-type" class="form-select">
                <option value="0">No discount</option>
                <option value="20">Senior Citizen / PWD (20%)</option>
                <option value="custom">Other percentage</option>
              </select>
              <input type="number" id="custom-discount" class="form-control mt-2 d-none" min="0" max="100" placeholder="Discount % (example: 10)">
            </div>
            <div class="mb-3">
              <label for="pay-method" class="form-label">Payment method <span class="small">(simulated, no real charge)</span></label>
              <select id="pay-method" class="form-select"><option>Cash</option><option>GCash</option><option>Card</option></select>
            </div>
            <div class="mb-3" id="cash-box">
              <label for="payment" class="form-label">Cash amount (₱)</label>
              <input type="number" id="payment" class="form-control" min="0" step="0.01" placeholder="0.00">
            </div>
            <hr>
            <dl class="row mb-3 receipt">
              <dt class="col-6 fw-normal">Subtotal</dt><dd class="col-6 text-end" id="subtotal">₱0.00</dd>
              <dt class="col-6 fw-normal">Discount</dt><dd class="col-6 text-end" id="discount">-₱0.00</dd>
              <dt class="col-6">Total</dt><dd class="col-6 text-end price" id="total">₱0.00</dd>
              <dt class="col-6 fw-normal">Change</dt><dd class="col-6 text-end" id="change">—</dd>
            </dl>
            <div id="checkout-error" class="alert alert-danger py-2 d-none" role="alert"></div>
            <button type="submit" class="btn btn-brand btn-lg w-100">Place order</button>
          </form>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
