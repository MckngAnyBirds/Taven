<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Taven | Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-nav"></div>
  <main>
    <div class="page-banner"><div class="container"><h1 class="h2 mb-1">Our Menu</h1><p>Pick your favorites and add them to your cart.</p></div></div>
    <div class="menu-toolbar py-3">
      <div class="container d-flex flex-wrap gap-2 align-items-center justify-content-between">
        <div class="d-flex flex-wrap gap-2">
          <button class="btn btn-outline-brand btn-sm px-3" data-go="appetizers">Appetizers</button>
          <button class="btn btn-outline-brand btn-sm px-3" data-go="meals">Meals</button>
          <button class="btn btn-outline-brand btn-sm px-3" data-go="drinks">Drinks</button>
          <button class="btn btn-outline-brand btn-sm px-3" data-go="desserts">Desserts</button>
        </div>
        <input type="search" id="menu-search" class="form-control rounded-pill" style="max-width:260px" placeholder="Search dishes" aria-label="Search dishes">
      </div>
    </div>
    <div class="container py-4" id="menu-root"></div>
  </main>
  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
